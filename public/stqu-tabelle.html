<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Stendaler Str. / Quedlinburger Str. Richtung Betriebshof Marzahn</title>
  <style>
    :root {
      --font-scale: 1.5;
      --bg: #000;
      --panel: #0d0d0d;
      --line: #333;
      --text: #fff;
      --muted: #aaa;
      --late: #f9a825;
      --early: #c62828;
      --row-alt: #0d0d0d;
      --header-bg: #111;
      --ok: #8bc34a;
      --warn: #ffd54f;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      padding: 0 8px 24px;
      background: #000;
      color: #fff;
      font-family: 'Roboto Condensed', sans-serif;
      font-size: calc(14px * var(--font-scale));
    }

    .board {
      width: 100%;
      max-width: 1200px;
      margin: 18px auto;
    }

    .title {
      margin: 0 0 14px;
      font-size: calc(28px * var(--font-scale));
      line-height: 1.1;
      font-weight: 700;
      color: var(--text);
      text-align: left;
    }

    .table-section {
      margin-top: 18px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #000;
    }

    th, td {
      border: 1px solid var(--line);
      padding: 8px 12px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: var(--header-bg);
      font-weight: 700;
      color: #fff;
    }

    tr:nth-child(even) { background: var(--row-alt); }
    tr.late { border-left: 3px solid var(--late); }
    tr.early { border-left: 3px solid var(--early); }

    th:nth-child(1), td:nth-child(1),
    th:nth-child(3), td:nth-child(3),
    th:nth-child(4), td:nth-child(4) {
      white-space: nowrap;
      width: 1%;
    }

    .line-col {
      font-weight: 700;
      white-space: nowrap;
      padding-left: 12px;
    }

    .destination-col {
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .time-col {
      text-align: right;
      font-weight: 700;
      white-space: nowrap;
    }

    .actual-col {
      text-align: right;
      white-space: nowrap;
    }

    .actual-time {
      display: inline-block;
      min-width: 3.1em;
      font-weight: 700;
    }

    .delay-chip {
      display: inline-block;
      margin-left: 8px;
      padding: 1px 6px;
      border: 1px solid #333;
      font-size: calc(13px * var(--font-scale));
      line-height: 1.3;
      vertical-align: middle;
    }

    .delay-chip.late {
      color: var(--late);
      border-color: var(--late);
    }

    .delay-chip.early {
      color: var(--early);
      border-color: var(--early);
    }

    .delay-chip.on-time {
      color: #bdbdbd;
      border-color: #666;
    }

    .placeholder {
      color: var(--muted);
      text-align: center;
      padding: 28px 16px;
      font-size: calc(18px * var(--font-scale));
    }

    @media (max-width: 1024px), (pointer: coarse) {
      .title { font-size: 24px; }
      th, td { font-size: 14px; }
      .delay-chip { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="board" aria-live="polite">
    <h1 class="title">Stendaler Str. / Quedlinburger Str. Richtung Betriebshof Marzahn</h1>
    <table>
      <thead>
        <tr>
          <th>Linie</th>
          <th>Ziel</th>
          <th>Soll</th>
          <th>Ist</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr>
          <td colspan="4" class="placeholder">Lade Abfahrten …</td>
        </tr>
      </tbody>
    </table>
  </main>

  <script>
    const FROM_STOP = "900175011";
    const TO_STOP = "900170010";
    const API_BASES = ["https://v6.vbb.transport.rest", "https://v6.bvg.transport.rest"];
    const MAX_RESULTS = 5;
    const REFRESH_MS = 60000;

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function parseIso(iso) {
      if (!iso) return null;
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return null;
      return d;
    }

    function formatTime(iso) {
      const d = parseIso(iso);
      if (!d) return "--:--";
      return d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
    }

    function getDelayMinutes(dep) {
      const planned = parseIso(dep?.plannedWhen);
      const actual = parseIso(dep?.when);

      if (planned && actual) {
        return Math.round((actual.getTime() - planned.getTime()) / 60000);
      }

      const delayValue = Number(dep?.delay);
      if (Number.isFinite(delayValue)) {
        return Math.round(delayValue);
      }

      return 0;
    }

    function getStatusLabel(diffMinutes) {
      if (diffMinutes > 0) return { type: "late", text: `+${diffMinutes} min` };
      if (diffMinutes < 0) return { type: "early", text: `${diffMinutes} min` };
      return { type: "ontime", text: "pünktlich" };
    }

    async function fetchWithRetry(url, retries = 2) {
      let lastError = null;
      for (let attempt = 0; attempt <= retries; attempt += 1) {
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (res.ok) return res;
          lastError = new Error(`HTTP ${res.status}`);
        } catch (error) {
          lastError = error;
        }
      }
      throw lastError || new Error("Netzwerkfehler");
    }

    async function fetchDepartures() {
      for (const base of API_BASES) {
        try {
          const url = `${base}/stops/${FROM_STOP}/departures?duration=90&results=30&language=de`;
          const res = await fetchWithRetry(url);
          const data = await res.json();
          if (Array.isArray(data?.departures)) return data.departures;
          if (Array.isArray(data)) return data;
        } catch (_) {
          // try next API base
        }
      }
      return [];
    }

    async function tripHasStop(tripId) {
      if (!tripId) return false;

      for (const base of API_BASES) {
        try {
          const url = `${base}/trips/${encodeURIComponent(tripId)}?stopovers=true&language=de`;
          const res = await fetchWithRetry(url);
          const data = await res.json();
          const stopovers = data?.trip?.stopovers;
          if (!Array.isArray(stopovers)) continue;

          const fromIndex = stopovers.findIndex(s => String(s?.stop?.id || "") === FROM_STOP);
          const future = fromIndex >= 0 ? stopovers.slice(fromIndex + 1) : stopovers;
          return future.some(s => String(s?.stop?.id || "") === TO_STOP);
        } catch (_) {
          // try next API base
        }
      }
      return false;
    }

    function renderRows(deps) {
      const rows = document.getElementById("rows");

      if (!deps.length) {
        rows.innerHTML = '<tr><td colspan="4" class="placeholder">Keine passenden Abfahrten gefunden.</td></tr>';
        return;
      }

      const html = deps.map(dep => {
        const line = escapeHtml(dep?.line?.name || "-");
        const target = escapeHtml(dep?.direction || "-");
        const planned = escapeHtml(formatTime(dep?.plannedWhen || dep?.when));
        const actualTime = escapeHtml(formatTime(dep?.when || dep?.plannedWhen));
        const diffMinutes = getDelayMinutes(dep);
        const status = getStatusLabel(diffMinutes);
        const rowClass = status.type === "late" || status.type === "early" ? status.type : "ontime";
        const chipText = status.type === "ontime" ? 'pünktlich' : `${status.text}`;

        return `
          <tr class="${rowClass}">
            <td class="line-col">${line}</td>
            <td class="destination-col">${target}</td>
            <td class="time-col">${planned}</td>
            <td class="actual-col">
              <span class="actual-time">${actualTime}</span>
              <span class="delay-chip ${status.type}">${escapeHtml(chipText)}</span>
            </td>
          </tr>
        `;
      }).join("");

      rows.innerHTML = html;
    }

    async function load() {
      const rows = document.getElementById("rows");
      rows.innerHTML = '<tr><td colspan="4" class="placeholder">Lade Abfahrten …</td></tr>';

      try {
        const departures = await fetchDepartures();
        const filtered = [];

        for (const dep of departures) {
          if (filtered.length >= MAX_RESULTS) break;
          if (await tripHasStop(dep?.tripId)) {
            filtered.push(dep);
          }
        }

        filtered.sort((a, b) => {
          const ta = new Date(a?.when || a?.plannedWhen || 0).getTime();
          const tb = new Date(b?.when || b?.plannedWhen || 0).getTime();
          return ta - tb;
        });

        renderRows(filtered.slice(0, MAX_RESULTS));
      } catch (error) {
        rows.innerHTML = `<tr><td colspan="4" class="placeholder">${escapeHtml(error?.message || "Unbekannter Fehler")}</td></tr>`;
      }
    }

    load();
    setInterval(load, REFRESH_MS);
  </script>
</body>
</html>
