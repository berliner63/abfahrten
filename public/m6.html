<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>M6 – Live Positionen</title>
<style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
    h1 { margin-bottom: 5px; }
    #status { padding: 8px; margin-bottom: 15px; border-radius: 5px; font-weight: bold; }
    .live { background: #c8f7c5; border: 1px solid #4caf50; }
    .fallback { background: #fff3cd; border: 1px solid #ffca2c; }
    .error { background: #f8d7da; border: 1px solid #f5c2c7; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { padding: 8px; border-bottom: 1px solid #ddd; text-align: left; }
    th { background: #eee; }
</style>
</head>
<body>

<h1>M6 – Live Positionen</h1>
<div id="status">Lade Daten…</div>

<table id="m6table">
    <thead>
        <tr>
            <th>Fahrzeug</th>
            <th>Richtung</th>
            <th>Nächste Haltestelle</th>
            <th>Entfernung</th>
            <th>Verspätung</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
function cleanDisplayName(value) {
    return String(value || "").replace(/\s*\(Berlin\)\s*/gi, " ").replace(/\s{2,}/g, " ").trim();
}

// Distanzberechnung
function distance(a, b) {
    const R = 6371e3;
    const toRad = x => x * Math.PI / 180;
    const dLat = toRad(b.latitude - a.latitude);
    const dLon = toRad(b.longitude - a.longitude);
    const lat1 = toRad(a.latitude);
    const lat2 = toRad(b.latitude);
    const h = Math.sin(dLat/2)**2 +
              Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
}

async function fetchJsonWithTimeout(url, timeoutMs = 8000) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

    try {
        const response = await fetch(url, { signal: controller.signal });
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        return await response.json();
    } finally {
        clearTimeout(timeoutId);
    }
}

async function fetchFirstSuccessfulJson(urls) {
    let lastError = null;
    for (const url of urls) {
        try {
            return await fetchJsonWithTimeout(url);
        } catch (error) {
            lastError = error;
        }
    }
    throw lastError || new Error("Alle Endpunkte fehlgeschlagen.");
}

function normalizeList(payload) {
    if (Array.isArray(payload)) return payload;
    if (Array.isArray(payload?.departures)) return payload.departures;
    if (Array.isArray(payload?.lines)) return payload.lines;
    if (Array.isArray(payload?.data)) return payload.data;
    return [];
}

const isDemoMode = new URLSearchParams(window.location.search).get("demo") === "1";

const demoRows = [
    { tripId: "demo-m6-1", direction: "S Hackescher Markt", stopName: "Strausberger Platz", dist: 180, delay: 0 },
    { tripId: "demo-m6-2", direction: "S Hackescher Markt", stopName: "Landsberger Allee/Petersburger Str.", dist: 510, delay: 60 },
];

let loadInProgress = false;
let loadRunId = 0;

async function loadData() {
    if (loadInProgress) return;
    loadInProgress = true;
    const currentRunId = ++loadRunId;
    const status = document.getElementById("status");
    const tableBody = document.querySelector("#m6table tbody");
    tableBody.innerHTML = "<tr><td colspan='5'>Lade Daten…</td></tr>";

    try {
        if (isDemoMode) {
            status.textContent = "Testmodus – Beispiel-Daten werden angezeigt";
            status.className = "live";
            tableBody.innerHTML = "";
            demoRows.forEach(rowData => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${rowData.tripId}</td>
                    <td>${rowData.direction}</td>
                    <td>${rowData.stopName}</td>
                    <td>${rowData.dist} m</td>
                    <td>${rowData.delay ? (rowData.delay/60).toFixed(1) + " min" : "0 min"}</td>
                `;
                tableBody.appendChild(row);
            });
            return;
        }

        let stops = [];
        try {
            const lineData = await fetchFirstSuccessfulJson([
                "https://v6.bvg.transport.rest/lines?query=M6&includeRoutes=true",
                "https://v6.vbb.transport.rest/lines?name=M6&variants=true"
            ]);
            const lines = normalizeList(lineData);
            const line = lines.find(l => String(l?.name || "") === "M6") || lines[0];
            stops = line?.routes?.[0]?.stops || line?.variants?.[0]?.stops || [];
        } catch {
            stops = [];
        }

        let radarData = [];
        try {
            radarData = await fetchFirstSuccessfulJson([
                "https://v6.bvg.transport.rest/radar?products=metro&north=52.60&south=52.48&east=13.70&west=13.45",
                "https://v6.vbb.transport.rest/radar?north=52.60&south=52.48&east=13.70&west=13.45"
            ]);
        } catch {
            radarData = [];
        }

        if (currentRunId !== loadRunId) return;

        const m6Vehicles = normalizeList(radarData).filter(v => v.line?.name === "M6" && v.location?.latitude && v.location?.longitude);

        tableBody.innerHTML = "";

        if (m6Vehicles.length > 0 && stops.length > 0) {
            status.textContent = "Live-Daten aktiv";
            status.className = "live";

            m6Vehicles.forEach(v => {
                const stopsWithLocation = stops.filter(s => s?.location?.latitude && s?.location?.longitude);
                const nearest = stopsWithLocation.length > 0
                    ? stopsWithLocation.map(stop => ({ stop, dist: distance(v.location, stop.location) })).sort((a,b) => a.dist - b.dist)[0]
                    : null;

                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${v.tripId || "–"}</td>
                    <td>${cleanDisplayName(v.direction) || "–"}</td>
                    <td>${cleanDisplayName(nearest?.stop?.name || "–")}</td>
                    <td>${nearest ? Math.round(nearest.dist) + " m" : "–"}</td>
                    <td>${v.delay ? (v.delay/60).toFixed(1) + " min" : "0 min"}</td>
                `;
                tableBody.appendChild(row);
            });

            return;
        }

        status.textContent = "Keine Live-Daten – Fahrplan wird angezeigt";
        status.className = "fallback";

        const firstStop = stops[0]?.id;
        if (!firstStop) {
            tableBody.innerHTML = "<tr><td colspan='5'>Keine M6-Haltestellen verfügbar.</td></tr>";
            return;
        }

        const depData = await fetchFirstSuccessfulJson([
            `https://v6.bvg.transport.rest/stops/${firstStop}/departures?duration=60`,
            `https://v6.vbb.transport.rest/stops/${firstStop}/departures?duration=60`
        ]);
        const m6 = normalizeList(depData).filter(d => d.line?.name === "M6");

        if (currentRunId !== loadRunId) return;

        if (m6.length === 0) {
            tableBody.innerHTML = "<tr><td colspan='5'>Keine M6-Fahrten im Fahrplan gefunden.</td></tr>";
            return;
        }

        m6.forEach(d => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>–</td>
                <td>${cleanDisplayName(d.direction)}</td>
                <td>${cleanDisplayName(d.stop?.name)}</td>
                <td>–</td>
                <td>${d.delay ? (d.delay/60).toFixed(1) + " min" : "0 min"}</td>
            `;
            tableBody.appendChild(row);
        });
    } catch {
        status.textContent = "Fehler beim Laden der Daten.";
        status.className = "error";
        tableBody.innerHTML = "<tr><td colspan='5'>Fehler beim Laden der Daten.</td></tr>";
    } finally {
        if (currentRunId === loadRunId) loadInProgress = false;
    }
}

loadData();
setInterval(loadData, 30000);
</script>

</body>
</html>
