<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Stendaler Str. / Quedlinburger Str. Richtung Betriebshof Marzahn</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #0d0d0d;
      --row: rgba(255, 255, 255, 0.02);
      --header: #101010;
      --line: #2a2a2a;
      --text: #ffffff;
      --muted: #b9b9b9;
      --late: #ffcc00;
      --late-strong: #ff4d4d;
      --ok: #7ce38b;
      --ok-text: #2ec76a;
      --red: #ff4d4d;
      --yellow: #ffcc00;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Roboto Condensed", "Segoe UI", Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    body {
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #000;
    }

    .board {
      width: 100%;
      max-width: 1200px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.02), 0 8px 24px var(--shadow);
      margin: 0;
    }

    .title {
      margin: 0;
      padding: 14px 18px 10px;
      font-size: clamp(28px, 2.8vw, 46px);
      font-weight: 700;
      line-height: 1.15;
      text-align: center;
      color: var(--text);
      background: #0b0b0b;
      border-bottom: 1px solid var(--line);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background: #050505;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    thead th {
      background: var(--header);
      color: #f5f5f5;
      font-size: clamp(18px, 1.9vw, 28px);
      font-weight: 700;
      text-align: left;
      padding: 14px 12px;
      border-bottom: 1px solid var(--line);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      letter-spacing: 0.02em;
    }

    thead th:nth-child(1) { width: 12%; }
    thead th:nth-child(2) { width: 46%; }
    thead th:nth-child(3) { width: 18%; }
    thead th:nth-child(4) { width: 24%; }

    tbody td {
      font-size: clamp(20px, 2vw, 30px);
      padding: 16px 12px;
      border-bottom: 1px solid var(--line);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      vertical-align: middle;
      background: rgba(255,255,255,0.01);
    }

    tbody tr:nth-child(odd) td {
      background: rgba(255,255,255,0.008);
    }

    tbody tr.late td {
      border-left: 4px solid var(--red);
    }

    tbody tr.early td {
      border-left: 4px solid var(--red);
    }

    tbody tr.ontime td {
      border-left: 4px solid transparent;
    }

    .line-col {
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      padding-left: 18px;
    }

    .destination-col {
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .time-col {
      text-align: right;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
    }

    .actual-col {
      text-align: right;
      white-space: nowrap;
      position: relative;
    }

    .actual-time {
      display: inline-block;
      min-width: 3.1em;
      font-weight: 700;
      color: var(--text);
      text-align: right;
    }

    .status-badge {
      display: inline-block;
      min-width: 90px;
      margin-left: 10px;
      padding: 2px 8px;
      border: 1px solid transparent;
      font-size: 0.8em;
      line-height: 1.3;
      font-weight: 700;
      text-align: center;
      vertical-align: middle;
    }

    .status-badge.ontime {
      color: var(--ok);
      border-color: rgba(124, 227, 139, 0.9);
      background: rgba(124, 227, 139, 0.08);
    }

    .status-badge.late {
      color: var(--late);
      border-color: rgba(255, 204, 0, 0.95);
      background: rgba(255, 204, 0, 0.06);
    }

    .status-badge.early {
      color: var(--red);
      border-color: rgba(255, 77, 77, 0.9);
      background: rgba(255, 77, 77, 0.06);
    }

    .status-badge.debug {
      color: #b5d7ff;
      border-color: rgba(181, 215, 255, 0.6);
      background: rgba(181, 215, 255, 0.08);
    }

    .placeholder {
      color: var(--muted);
      text-align: center;
      padding: 28px 16px;
      font-size: clamp(20px, 1.8vw, 28px);
    }

    @media (max-width: 900px) {
      .title {
        font-size: 26px;
      }

      thead th, tbody td {
        font-size: 18px;
      }

      .status-badge {
        min-width: 72px;
        margin-left: 6px;
      }
    }
  </style>
</head>
<body>
  <main class="board" aria-live="polite">
    <h1 class="title">Stendaler Str. / Quedlinburger Str. Richtung Betriebshof Marzahn</h1>
    <table>
      <thead>
        <tr>
          <th>Linie</th>
          <th>Ziel</th>
          <th>Soll</th>
          <th>Ist</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr>
          <td colspan="4" class="placeholder">Lade Abfahrten …</td>
        </tr>
      </tbody>
    </table>
  </main>

  <script>
    const FROM_STOP = "900175011";
    const TO_STOP = "900170010";
    const API_BASES = ["https://v6.vbb.transport.rest", "https://v6.bvg.transport.rest"];
    const MAX_RESULTS = 5;
    const REFRESH_MS = 60000;

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function parseIso(iso) {
      if (!iso) return null;
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return null;
      return d;
    }

    function formatTime(iso) {
      const d = parseIso(iso);
      if (!d) return "--:--";
      return d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
    }

    function getDelayMinutes(dep) {
      const planned = parseIso(dep?.plannedWhen);
      const actual = parseIso(dep?.when);

      if (planned && actual) {
        return Math.round((actual.getTime() - planned.getTime()) / 60000);
      }

      const delayValue = Number(dep?.delay);
      if (Number.isFinite(delayValue)) {
        return Math.round(delayValue);
      }

      return 0;
    }

    function getStatusLabel(diffMinutes) {
      if (diffMinutes > 0) return { type: "late", text: `+${diffMinutes} min` };
      if (diffMinutes < 0) return { type: "early", text: `${diffMinutes} min` };
      return { type: "ontime", text: "pünktlich" };
    }

    async function fetchWithRetry(url, retries = 2) {
      let lastError = null;
      for (let attempt = 0; attempt <= retries; attempt += 1) {
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (res.ok) return res;
          lastError = new Error(`HTTP ${res.status}`);
        } catch (error) {
          lastError = error;
        }
      }
      throw lastError || new Error("Netzwerkfehler");
    }

    async function fetchDepartures() {
      for (const base of API_BASES) {
        try {
          const url = `${base}/stops/${FROM_STOP}/departures?duration=90&results=30&language=de`;
          const res = await fetchWithRetry(url);
          const data = await res.json();
          if (Array.isArray(data?.departures)) return data.departures;
          if (Array.isArray(data)) return data;
        } catch (_) {
          // try next API base
        }
      }
      return [];
    }

    async function tripHasStop(tripId) {
      if (!tripId) return false;

      for (const base of API_BASES) {
        try {
          const url = `${base}/trips/${encodeURIComponent(tripId)}?stopovers=true&language=de`;
          const res = await fetchWithRetry(url);
          const data = await res.json();
          const stopovers = data?.trip?.stopovers;
          if (!Array.isArray(stopovers)) continue;

          const fromIndex = stopovers.findIndex(s => String(s?.stop?.id || "") === FROM_STOP);
          const future = fromIndex >= 0 ? stopovers.slice(fromIndex + 1) : stopovers;
          return future.some(s => String(s?.stop?.id || "") === TO_STOP);
        } catch (_) {
          // try next API base
        }
      }
      return false;
    }

    function renderRows(deps) {
      const rows = document.getElementById("rows");

      if (!deps.length) {
        rows.innerHTML = '<tr><td colspan="4" class="placeholder">Keine passenden Abfahrten gefunden.</td></tr>';
        return;
      }

      const html = deps.map(dep => {
        const line = escapeHtml(dep?.line?.name || "-");
        const target = escapeHtml(dep?.direction || "-");
        const planned = escapeHtml(formatTime(dep?.plannedWhen || dep?.when));
        const actualTime = escapeHtml(formatTime(dep?.when || dep?.plannedWhen));
        const diffMinutes = getDelayMinutes(dep);
        const status = getStatusLabel(diffMinutes);
        const rowClass = status.type === "late" || status.type === "early" ? status.type : "ontime";

        return `
          <tr class="${rowClass}">
            <td class="line-col">${line}</td>
            <td class="destination-col">${target}</td>
            <td class="time-col">${planned}</td>
            <td class="actual-col">
              <span class="actual-time">${actualTime}</span>
              <span class="status-badge ${status.type}">${escapeHtml(status.text)}</span>
            </td>
          </tr>
        `;
      }).join("");

      rows.innerHTML = html;
    }

    async function load() {
      const rows = document.getElementById("rows");
      rows.innerHTML = '<tr><td colspan="4" class="placeholder">Lade Abfahrten …</td></tr>';

      try {
        const departures = await fetchDepartures();
        const filtered = [];

        for (const dep of departures) {
          if (filtered.length >= MAX_RESULTS) break;
          if (await tripHasStop(dep?.tripId)) {
            filtered.push(dep);
          }
        }

        filtered.sort((a, b) => {
          const ta = new Date(a?.when || a?.plannedWhen || 0).getTime();
          const tb = new Date(b?.when || b?.plannedWhen || 0).getTime();
          return ta - tb;
        });

        renderRows(filtered.slice(0, MAX_RESULTS));
      } catch (error) {
        rows.innerHTML = `<tr><td colspan="4" class="placeholder">${escapeHtml(error?.message || "Unbekannter Fehler")}</td></tr>`;
      }
    }

    load();
    setInterval(load, REFRESH_MS);
  </script>
</body>
</html>
